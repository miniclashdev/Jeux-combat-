<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Duel Arena 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#141733;--panel:#1b1e44;--panel2:#23275a;--line:rgba(255,255,255,.16);--acc:#ffd23f;--hot:#ff3d6e;--ok:#3ddc84;--blue:#4da3ff;--txt:#fff;--mut:#b8bdea;
 --rc:#b8c0d0;--rr:#4da3ff;--re:#b983ff;--rl:#ffb020;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141733}}
:root[data-theme="dark"]{--bg:#141733}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#gl,#ov{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none;z-index:2}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#err{position:fixed;left:10px;right:10px;bottom:10px;z-index:99;background:#b00020;color:#fff;padding:10px;border-radius:10px;font-size:13px;display:none}
.bung{font-family:'Bungee',Impact,'Arial Black',sans-serif}
.rc{color:var(--rc)}.rr{color:var(--rr)}.re{color:var(--re)}.rl{color:var(--rl)}

/* splash */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;touch-action:pan-y;gap:14px;background:radial-gradient(circle at 50% 30%,rgba(255,61,110,.35),rgba(20,23,51,.92) 60%);text-align:center;padding:20px}
#splash h1{font-family:'Bungee',Impact,'Arial Black',sans-serif;font-size:clamp(40px,11vw,86px);margin:0;line-height:.9;text-shadow:0 6px 0 #0a0c20,0 0 40px rgba(255,61,110,.5);transform:rotate(-3deg)}
#splash h1 small{display:block;color:var(--acc);font-size:.4em}
.big{display:block;width:100%;max-width:420px;margin:12px auto 6px;padding:16px;border:none;border-radius:18px;background:var(--hot);font-family:'Bungee',Impact,'Arial Black',sans-serif;font-size:22px;box-shadow:0 6px 0 #9c1236}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #9c1236}
.big:disabled{opacity:.45}
.hint{color:var(--mut);font-size:13.5px;line-height:1.5}

/* HUD commun */
.pill{background:rgba(10,12,32,.8);border:2px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:800;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
#lhud{position:fixed;inset:0;pointer-events:none;z-index:5}
#lhud .tl{position:fixed;left:calc(env(safe-area-inset-left,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:6px;flex-wrap:wrap;max-width:60vw}
#lhud .tr{max-width:156px;flex-wrap:wrap;justify-content:flex-end;position:fixed;right:calc(env(safe-area-inset-right,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:6px;pointer-events:auto}
.ibtn{width:46px;height:46px;border-radius:14px;background:rgba(10,12,32,.8);border:2px solid var(--line);font-size:20px;display:flex;align-items:center;justify-content:center;position:relative}
.ibtn .dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--hot);border:2px solid #0a0c20}
#talk{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);pointer-events:auto;padding:14px 22px;border-radius:16px;border:none;background:var(--acc);color:#1a1a1a;font-weight:800;font-size:17px;box-shadow:0 5px 0 #a78200;white-space:nowrap}
#fightBtn{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%);pointer-events:auto;padding:9px 18px;border-radius:14px;border:none;background:var(--hot);font-family:'Bungee',Impact,sans-serif;font-size:16px;box-shadow:0 4px 0 #9c1236}
body.touch #talk{bottom:calc(env(safe-area-inset-bottom,0px) + 150px);left:auto;right:calc(env(safe-area-inset-right,0px) + 20px);transform:none}

/* panneaux */
#panel{position:fixed;inset:0;z-index:30;background:rgba(10,12,32,.55);display:flex;align-items:flex-end;justify-content:center;touch-action:pan-y}
#pbox{width:100%;max-width:820px;max-height:92%;background:var(--panel);border:2px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;display:flex;flex-direction:column;
 padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px) and (min-height:500px){#panel{align-items:center}#pbox{border-radius:22px;border-bottom:2px solid var(--line);max-height:88%}}
#phead{flex:none;display:flex;align-items:center;gap:12px;padding:14px 16px 10px;border-bottom:2px solid var(--line)}
#phead .face{font-size:34px}
#pTitle{font-family:'Bungee',Impact,sans-serif;font-size:20px;line-height:1.1}
#pSay{color:var(--mut);font-size:13px;margin-top:2px}
#pClose{margin-left:auto;width:42px;height:42px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);font-size:18px;flex:none}
#pTabs{flex:none;display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto}
#pTabs button{background:transparent;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px;white-space:nowrap}
#pTabs button.on{background:var(--acc);color:#1a1a1a;border-color:var(--acc)}
#pBody{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 18px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px}
.card{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:11px;text-align:left;position:relative;display:block;width:100%}
.card.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,210,63,.22)}
.card b{display:block;font-size:15px;margin-bottom:2px}
.card .s{color:var(--mut);font-size:12.5px;line-height:1.35;display:block}
.card .ico{font-size:24px;display:block;margin-bottom:3px}
.card .tag{position:absolute;top:8px;right:8px;font-size:11px;font-weight:800;padding:3px 7px;border-radius:999px;background:#0a0c20}
.card.rar-c{border-left:5px solid var(--rc)}.card.rar-r{border-left:5px solid var(--rr)}.card.rar-e{border-left:5px solid var(--re)}.card.rar-l{border-left:5px solid var(--rl);background:linear-gradient(135deg,#2d2a4a,#3a2f2a)}
.act{display:inline-block;margin-top:8px;padding:8px 12px;border-radius:10px;border:none;background:var(--hot);font-weight:800;font-size:13.5px}
.act.alt{background:var(--panel);border:2px solid var(--line)}
.act.ok{background:var(--ok);color:#06240f}
.act:disabled{opacity:.4}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips button{background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:8px 13px;font-weight:600;font-size:13.5px}
.chips button.on{border-color:var(--hot);background:var(--hot)}
h4{margin:14px 0 8px;font-size:14px;color:var(--mut);font-weight:600}
.bar{height:10px;background:#0a0c20;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.slot{background:#0a0c20;border:2px dashed var(--line);border-radius:12px;padding:9px;text-align:left}
.slot.full{border-style:solid}
.slot small{display:block;color:var(--mut);font-size:11.5px}
input[type=range]{width:50%;accent-color:var(--acc)}
input[type=text],input[type=password]{width:100%;padding:11px;border-radius:10px;border:2px solid var(--line);background:#0a0c20;color:#fff;font-size:15px;font-family:inherit}
.sel{width:100%;padding:10px;margin:4px 0 8px;border-radius:10px;border:2px solid var(--line);background:#0a0c20;color:#fff;font-size:15px;font-family:inherit}
textarea{width:100%;padding:10px;border-radius:10px;border:2px solid var(--line);background:#0a0c20;color:#fff;font-size:13px;font-family:ui-monospace,monospace;resize:none}
#wheelWrap{position:relative;width:min(300px,76vw);aspect-ratio:1;margin:6px auto}
#wheelCv{width:100%;height:100%;display:block}
#wheelPtr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid #fff;filter:drop-shadow(0 2px 2px #000)}
.odds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;font-size:12.5px;color:var(--mut)}
.reveal{text-align:center;padding:14px;border-radius:14px;background:#0a0c20;border:2px solid var(--acc);margin:10px 0}
.reveal b{font-size:20px;display:block}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:#0a0c20;border:2px solid var(--acc);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;max-width:90vw;text-align:center}

/* HUD combat */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#scope{position:fixed;inset:0;background:radial-gradient(circle at center,transparent 0 34vmin,rgba(0,0,0,.93) 34.4vmin)}
#scope:before,#scope:after{content:"";position:absolute;background:#000;left:50%;top:50%}
#scope:before{width:2px;height:68vmin;transform:translate(-50%,-50%)}
#scope:after{height:2px;width:68vmin;transform:translate(-50%,-50%)}
#flash{position:fixed;inset:0;background:radial-gradient(circle at center,transparent 35%,rgba(255,20,60,.8));opacity:0}
#cross{position:fixed;left:50%;top:50%;width:80px;height:80px;margin:-40px 0 0 -40px;pointer-events:none}
#cross i{position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.7)}
#cross i:nth-child(1){width:2px;height:8px;left:-1px;top:-14px}
#cross i:nth-child(2){width:2px;height:8px;left:-1px;top:6px}
#cross i:nth-child(3){width:8px;height:2px;top:-1px;left:-14px}
#cross i:nth-child(4){width:8px;height:2px;top:-1px;left:6px}
#cross i:nth-child(5){width:4px;height:4px;left:-2px;top:-2px;border-radius:50%}
#hitm{position:fixed;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%) rotate(45deg);opacity:0;color:#fff}
#hitm:before,#hitm:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#hitm:before{width:28px;height:3px;background:linear-gradient(90deg,currentColor 35%,transparent 35% 65%,currentColor 65%)}
#hitm:after{height:28px;width:3px;background:linear-gradient(180deg,currentColor 35%,transparent 35% 65%,currentColor 65%)}
#top{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%);text-align:center;background:rgba(10,12,32,.72);border-radius:14px;padding:5px 14px;min-width:160px}
#score{font-family:'Bungee',Impact,'Arial Black',sans-serif;font-size:19px;white-space:nowrap}
#sub{font-size:12px;color:var(--mut);white-space:nowrap}
#mini{position:fixed;right:calc(env(safe-area-inset-right,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 58px);width:96px;height:96px;border-radius:12px;border:2px solid rgba(255,255,255,.3);background:rgba(10,12,32,.6)}
#feed{position:fixed;right:calc(env(safe-area-inset-right,0px) + 116px);top:calc(env(safe-area-inset-top,0px) + 58px);display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12.5px;font-weight:600}
#feed div{background:rgba(10,12,32,.75);padding:3px 9px;border-radius:8px;white-space:nowrap}
#banner{position:fixed;left:0;right:0;top:26%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:12}
#banner b{font-family:'Bungee',Impact,'Arial Black',sans-serif;font-size:clamp(30px,8vw,62px);display:block;text-shadow:0 4px 0 #000}
#banner span{font-weight:600;font-size:16px;text-shadow:0 2px 4px #000;padding:0 16px;display:block}
#stat{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(270px,42vw)}
#hpnum{font-family:'Bungee',Impact,'Arial Black',sans-serif;font-size:32px;line-height:1;text-shadow:0 3px 0 #000}
.hpb{height:12px;background:rgba(0,0,0,.55);border-radius:6px;overflow:hidden;margin-top:4px;border:2px solid rgba(255,255,255,.2)}
#hpbar{height:100%;width:100%;background:var(--ok)}
#buffs{margin-top:6px;font-size:12.5px;font-weight:800;display:flex;gap:5px;flex-wrap:wrap}
#buffs span{background:rgba(10,12,32,.75);padding:3px 7px;border-radius:8px}
#wep{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);text-align:right}
#wname{font-weight:800;font-size:15px;text-shadow:0 2px 3px #000}
#ammo{font-family:'Bungee',Impact,'Arial Black',sans-serif;font-size:28px;text-shadow:0 3px 0 #000}
#cheatBtn{position:fixed;right:calc(env(safe-area-inset-right,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 164px);pointer-events:auto;width:44px;height:44px;border-radius:12px;background:rgba(10,12,32,.72);border:2px solid var(--line);font-size:20px;padding:0}
#cheatBtn.on{border-color:#ff3d6e;background:rgba(255,61,110,.55)}
#pauseBtn{position:fixed;right:calc(env(safe-area-inset-right,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 8px);pointer-events:auto;width:44px;height:44px;border-radius:12px;background:rgba(10,12,32,.72);border:2px solid var(--line);font-weight:800;font-size:15px}
#resp{position:fixed;left:0;right:0;bottom:32%;text-align:center;font-weight:800;font-size:18px;text-shadow:0 2px 4px #000}
body.touch #stat{top:calc(env(safe-area-inset-top,0px) + 8px);bottom:auto;width:min(190px,32vw)}
body.touch #hpnum{font-size:22px}
body.touch #wep{top:calc(env(safe-area-inset-top,0px) + 74px);bottom:auto;left:calc(env(safe-area-inset-left,0px) + 12px);right:auto;text-align:left}
body.touch #ammo{font-size:20px}
body.touch #wname{font-size:13px}

/* tactile */
#touch{position:fixed;inset:0;display:none;touch-action:none;z-index:4}
body.touch.playing #touch{display:block}
#joyZone{position:fixed;left:0;bottom:0;width:42%;height:65%;touch-action:none}
#lookZone{position:fixed;right:0;top:0;width:58%;height:100%;touch-action:none}
#joyBase{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);pointer-events:none;left:110px;top:calc(100% - 130px);opacity:.45}
#joyBase.on{opacity:1}
#joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.6)}
.tb{position:fixed;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.05;touch-action:none;padding:0}
.tb em{font-style:normal;font-size:20px;pointer-events:none}
.tb.pressed{background:rgba(255,255,255,.45)}
.tb.cd{opacity:.4}
body.lobby .cb{display:none}
#bFire{right:calc(env(safe-area-inset-right,0px) + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 76px);width:94px;height:94px;background:rgba(255,61,110,.5);border-color:#ff9db4}
#bFire2{left:calc(env(safe-area-inset-left,0px) + 22px);top:calc(env(safe-area-inset-top,0px) + 150px);width:62px;height:62px;background:rgba(255,61,110,.4);border-color:#ff9db4}
#bJump{right:calc(env(safe-area-inset-right,0px) + 132px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:66px;height:66px}
body.lobby #bJump{right:calc(env(safe-area-inset-right,0px) + 30px);bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:76px;height:76px}
#bDash{right:calc(env(safe-area-inset-right,0px) + 136px);bottom:calc(env(safe-area-inset-bottom,0px) + 108px);width:58px;height:58px}
#bReload{right:calc(env(safe-area-inset-right,0px) + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 184px);width:54px;height:54px}
#bSwap{right:calc(env(safe-area-inset-right,0px) + 88px);bottom:calc(env(safe-area-inset-bottom,0px) + 196px);width:54px;height:54px}
#bUtil{right:calc(env(safe-area-inset-right,0px) + 210px);bottom:calc(env(safe-area-inset-bottom,0px) + 50px);width:60px;height:60px}
#bAim{right:calc(env(safe-area-inset-right,0px) + 154px);bottom:calc(env(safe-area-inset-bottom,0px) + 184px);width:54px;height:54px}

/* écran de fin */
#end{position:fixed;inset:0;z-index:40;overflow-y:auto;background:rgba(20,23,51,.95);padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);text-align:center;touch-action:pan-y}
#endTitle{font-family:'Bungee',Impact,'Arial Black',sans-serif;font-size:clamp(40px,12vw,76px);margin:10px 0 4px;text-shadow:0 5px 0 #0a0c20}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;max-width:700px;margin:14px auto}
.stats div{background:var(--panel2);border-radius:14px;padding:10px;border:2px solid var(--line)}
.stats b{font-size:21px;display:block}
.stats span{color:var(--mut);font-size:12.5px}
#endBtns{position:sticky;bottom:calc(-1 * env(safe-area-inset-bottom,0px) - 20px);display:flex;gap:10px;max-width:640px;margin:10px auto 0;padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(transparent,rgba(20,23,51,.98) 30%)}
#endBtns .big{margin:0;font-size:18px;padding:14px 10px}
#pause{position:fixed;inset:0;z-index:40;background:rgba(20,23,51,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
</style>
</head>
<body class="lobby">
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>

<div id="splash">
  <h1>Duel<small>Arena 3D</small></h1>
  <p class="hint" style="max-width:420px">Un lobby, des marchands, une roue de la fortune, des armes à customiser et des duels en 3D.</p>
  <div id="accBox" style="width:100%;max-width:420px"></div>
  <button type="button" class="big hidden" id="enter">Entrer dans le lobby</button>
  <p class="hint" id="glNote"></p>
</div>

<div id="lhud" class="hidden">
  <div class="tl"><span class="pill" id="lvPill">⭐ Niv. 1</span><span class="pill" id="coinPill">🪙 0</span><span class="pill" id="tkPill">🎟️ 0</span></div>
  <button type="button" id="fightBtn">⚔️ Combat</button>
  <div class="tr">
    <button type="button" class="ibtn" data-open="rank" aria-label="Classement">🏆</button>
    <button type="button" class="ibtn" data-open="locker" aria-label="Casier">🎒</button>
    <button type="button" class="ibtn" data-open="quests" aria-label="Quêtes">📜<span class="dot hidden" id="qDot"></span></button>
    <button type="button" class="ibtn" data-open="settings" aria-label="Réglages">⚙️</button>
    <button type="button" class="ibtn" id="danceBtn" aria-label="Danser">💃</button>
  </div>
  <button type="button" id="talk" class="hidden"></button>
</div>

<div id="hud" class="hidden">
  <div id="scope" class="hidden"></div>
  <div id="flash"></div>
  <div id="cross"></div>
  <div id="hitm"></div>
  <div id="top"><div id="score"></div><div id="sub"></div></div>
  <canvas id="mini" width="96" height="96"></canvas>
  <div id="feed"></div>
  <div id="resp"></div>
  <div id="stat"><div id="hpnum">100</div><div class="hpb"><div id="hpbar"></div></div><div id="buffs"></div></div>
  <div id="wep"><div id="wname"></div><div id="ammo"></div></div>
  <button id="pauseBtn" aria-label="Pause">❚❚</button>
  <button id="cheatBtn" class="hidden" aria-label="Visée automatique">🎯</button>
</div>

<div id="banner"><b id="banT"></b><span id="banS"></span></div>

<div id="touch">

/* ================== ÉCHANGES ENTRE JOUEURS ================== */
const TSLOTS=16,TTL=300000;
const TR={peer:null,slot:-1,conns:[],lock:false,hosting:false,timer:null,pend:null,pendTO:null,scan:{peer:null,list:[],busy:false,done:true,err:'',to:null}};
const cleanMods=m=>{const o={};if(m&&typeof m==='object')for(const sl in SLOTS){const v=m[sl];if(v&&PARTS[v]&&PARTS[v].s===sl)o[sl]=v;}return o;};
function cleanWs(arr,n){const ws=(Array.isArray(arr)?arr:[]).slice(0,n||2).map(x=>({w:x&&W[x.w]?x.w:'pistol',m:cleanMods(x&&x.m)}));if(!ws.length)ws.push({w:'pistol',m:{}});return ws;}
function cleanItem(x){if(!x||typeof x!=='object')return null;if(x.t==='w'&&W[x.k])return{t:'w',k:x.k,m:cleanMods(x.m)};if(x.t==='p'&&PARTS[x.k])return{t:'p',k:x.k};return null;}
const itemName=x=>x.t==='w'?W[x.k].i+' '+W[x.k].n:SLOTS[PARTS[x.k].s].i+' '+PARTS[x.k].n;
const itemRar=x=>x.t==='w'?W[x.k].r:PARTS[x.k].r;
const fmtMs=ms=>{ms=Math.max(0,Math.ceil(ms/1000));return Math.floor(ms/60)+':'+String(ms%60).padStart(2,'0');};
const renderIfBoard=()=>{if(PNL==='market'&&PTAB==='board')renderPanel();};
function giveItem(x,quiet){if(x.t==='w'){S.inv.push({u:S.uid++,w:x.k,m:Object.assign({},x.m||{})});if(!quiet&&W[x.k].r==='l')S.st.legend++;}else addPart(x.k);}
function takeOut(spec){const [t,v]=String(spec||'').split(':');
 if(t==='w'){const it=item(+v);if(!it||equipped(it.u))return null;S.inv=S.inv.filter(i=>i!==it);if(workSel===it.u)workSel=null;return{t:'w',k:it.w,m:Object.assign({},it.m)};}
 if(t==='p'){if(!S.parts[v])return null;S.parts[v]--;if(!S.parts[v])delete S.parts[v];return{t:'p',k:v};}
 return null;}
const hasWant=w=>w.t==='p'?(S.parts[w.k]>0):S.inv.some(i=>i.w===w.k&&!equipped(i.u));
function takeMatch(w){if(w.t==='p')return S.parts[w.k]>0?takeOut('p:'+w.k):null;const c=S.inv.filter(i=>i.w===w.k&&!equipped(i.u)).sort((a,b)=>wValue(a)-wValue(b))[0];return c?takeOut('w:'+c.u):null;}
/* --- vendeur : publier une annonce --- */
async function tradePost(giveSpec,wantSpec){
 if(S.escrow||TR.hosting){toast('Tu as déjà une annonce en cours');return;}
 const [wt,wk]=String(wantSpec||'').split(':');const want=cleanItem({t:wt,k:wk});if(!want){toast("Choisis ce que tu veux en échange");return;}
 const g=takeOut(giveSpec);if(!g){toast("Cet objet n'est pas disponible");return;}
 S.escrow={give:g,want,exp:Date.now()+TTL,name:S.name||'Joueur'};persist();TR.hosting=true;TR.lock=false;renderPanel();
 try{await loadPeer();}catch(e){tradeCancel();toast('Mode en ligne indisponible : objet rendu.');return;}
 let hp=null;for(let i=0;i<TSLOTS&&!hp;i++){try{hp=await newPeer(NS+'t-'+i);TR.slot=i;}catch(e){if(!(e&&e.type==='unavailable-id'))break;}}
 if(!S.escrow){if(hp)try{hp.destroy();}catch(e){}return;}
 if(!hp){tradeCancel();toast('Impossible de publier (réseau ou marché plein) : objet rendu.');return;}
 TR.peer=hp;hp.on('error',()=>{});hp.on('connection',tradeIncoming);
 clearTimeout(TR.timer);TR.timer=setTimeout(tradeExpire,Math.max(1000,S.escrow.exp-Date.now()));renderIfBoard();}
function tradeIncoming(c){const go=()=>{const o=S.escrow;if(!o||TR.lock){try{c.send({t:'gone'});}catch(e){}return;}
  TR.conns.push(c);try{c.send({t:'offer',n:o.name,tr:S.trophies||0,give:o.give,want:o.want,ms:Math.max(0,o.exp-Date.now())});}catch(e){}
  c.on('data',d=>tradeData(c,d));c.on('close',()=>{TR.conns=TR.conns.filter(x=>x!==c);});c.on('error',()=>{});};
 if(c.open)go();else c.on('open',go);}
function tradeData(c,d){if(!d||d.t!=='take')return;const o=S.escrow;const no=r=>{try{c.send({t:'no',r});}catch(e){}};
 if(!o||TR.lock||Date.now()>o.exp)return no('Annonce terminée');
 const it=cleanItem(d.it);if(!it||it.t!==o.want.t||it.k!==o.want.k)return no("Ce n'est pas l'objet demandé");
 TR.lock=true;giveItem(it);const gave=o.give;S.escrow=null;persist();
 try{c.send({t:'ok',give:gave});}catch(e){}
 toast('🎉 Échange réussi ! Tu reçois '+itemName(it)+' de '+esc(String(d.n||'un joueur').replace(/[<>&"]/g,'').slice(0,14)));snd('legend');
 TR.conns.forEach(x=>{if(x!==c)try{x.send({t:'gone'});}catch(e){}});
 setTimeout(tradeCleanupHost,1200);renderIfBoard();updateLobbyHud();}
function tradeCleanupHost(){clearTimeout(TR.timer);TR.conns.forEach(c=>{try{c.close();}catch(e){}});TR.conns=[];const pr=TR.peer;TR.peer=null;if(pr)try{pr.destroy();}catch(e){}TR.hosting=false;TR.lock=false;TR.slot=-1;}
function tradeCancel(){const o=S.escrow;if(o){giveItem(o.give,true);S.escrow=null;persist();}TR.conns.forEach(c=>{try{c.send({t:'gone'});}catch(e){}});tradeCleanupHost();renderIfBoard();updateLobbyHud();}
function tradeExpire(){if(!S.escrow)return;tradeCancel();toast("⏳ Ton annonce a expiré : l'objet est revenu dans ton inventaire.");}
function tradeRecover(){let back=false;if(S.escrow){giveItem(S.escrow.give,true);S.escrow=null;back=true;}if(S.pend){giveItem(S.pend.it,true);S.pend=null;back=true;}if(back){persist();setTimeout(()=>toast("Un échange interrompu : ton objet t'a été rendu."),900);}}
/* --- acheteur : voir et accepter les annonces --- */
function tradeStopScan(){if(TR.pend)return;const sc=TR.scan;sc.done=true;sc.busy=false;clearTimeout(sc.to);sc.list=[];const pr=sc.peer;sc.peer=null;if(pr)try{pr.destroy();}catch(e){}}
async function tradeScan(){const sc=TR.scan;if(TR.pend)return;tradeStopScan();sc.busy=true;sc.done=false;sc.err='';renderIfBoard();
 try{await loadPeer();}catch(e){sc.busy=false;sc.done=true;sc.err='Mode en ligne indisponible (connexion internet ?)';renderIfBoard();return;}
 let me;try{me=await newPeer(null);}catch(e){sc.busy=false;sc.done=true;sc.err='Impossible de joindre le serveur de jeu.';renderIfBoard();return;}
 if(sc.done){try{me.destroy();}catch(e){}return;}
 sc.peer=me;me.on('error',()=>{});
 for(let i=0;i<TSLOTS;i++){if(i===TR.slot)continue;let c;try{c=me.connect(NS+'t-'+i,{reliable:true,serialization:'json'});}catch(e){continue;}if(!c)continue;
  c.on('data',d=>{if(!d||typeof d!=='object')return;
   if(d.t==='offer'){const g=cleanItem(d.give),w=cleanItem(d.want);if(!g||!w)return;const o={c,slot:i,n:String(d.n||'Joueur').replace(/[<>&"]/g,'').slice(0,14),tr:Math.max(0,+d.tr||0),give:g,want:w,until:performance.now()+clamp(+d.ms||0,0,TTL+5000)};const ex=sc.list.find(x=>x.c===c);if(ex)Object.assign(ex,o);else sc.list.push(o);renderIfBoard();}
   else if(d.t==='gone'){sc.list=sc.list.filter(x=>x.c!==c);if(!(TR.pend&&TR.pend.c===c)){try{c.close();}catch(e){}}renderIfBoard();}
   else if(d.t==='ok'||d.t==='no')tradeReply(c,d);});
  c.on('close',()=>{sc.list=sc.list.filter(x=>x.c!==c);if(TR.pend&&TR.pend.c===c)tradeFinish(false,'Le joueur est parti');renderIfBoard();});c.on('error',()=>{});}
 sc.to=setTimeout(()=>{sc.busy=false;sc.done=true;renderIfBoard();},7000);}
function tradeAccept(i){const o=TR.scan.list[i];if(!o||TR.pend)return;
 if(!o.c||o.c.open===false){toast('Cette annonce a disparu');return;}
 const it=takeMatch(o.want);if(!it){toast("Tu n'as pas "+itemName(o.want)+' (ou il est équipé).');return;}
 S.pend={it,t:Date.now()};persist();TR.pend={c:o.c,o};
 try{o.c.send({t:'take',it,n:S.name||'Joueur'});}catch(e){tradeFinish(false,'Connexion perdue');return;}
 clearTimeout(TR.pendTO);TR.pendTO=setTimeout(()=>tradeFinish(false,'Pas de réponse du joueur'),12000);renderIfBoard();}
function tradeReply(c,d){if(!TR.pend||TR.pend.c!==c)return;
 if(d.t==='ok'){const g=cleanItem(d.give);if(!g){tradeFinish(false,'Réponse invalide');return;}giveItem(g);S.pend=null;tradeFinish(true,g);}
 else tradeFinish(false,String(d.r||'Refusé').slice(0,60));}
function tradeFinish(ok,info){clearTimeout(TR.pendTO);const pd=TR.pend;TR.pend=null;
 if(ok){persist();toast('🎉 Échange réussi ! Tu reçois '+itemName(info));snd('legend');if(pd){TR.scan.list=TR.scan.list.filter(x=>x!==pd.o);try{pd.c.close();}catch(e){}}}
 else{if(S.pend){giveItem(S.pend.it,true);S.pend=null;persist();}toast('Échange annulé : '+info+'. Ton objet est revenu.');}
 renderIfBoard();updateLobbyHud();}
setInterval(()=>{const now=performance.now(),sc=TR.scan,n0=sc.list.length;sc.list=sc.list.filter(o=>o.until>now);
 if(sc.list.length!==n0)renderIfBoard();else if(PNL==='market'&&PTAB==='board')document.querySelectorAll('[data-cd]').forEach(e=>{e.textContent=fmtMs(+e.dataset.cd-(e.dataset.k==='me'?Date.now():now));});},1000);
function boardHTML(){const o=S.escrow,sc=TR.scan;let h=`<p class="hint">Ici apparaissent les annonces des joueurs <b>connectés en ce moment</b>. Quand quelqu'un accepte, les deux objets s'échangent aussitôt. Ton annonce disparaît après 5 minutes, ou si tu fermes le jeu : ton objet te revient.</p>`;
 if(o){h+=`<div class="row" style="display:block;border-color:var(--acc)"><b>📢 Ton annonce</b><br>Tu donnes <b class="r${itemRar(o.give)}">${itemName(o.give)}</b> contre <b class="r${itemRar(o.want)}">${itemName(o.want)}</b><br><span class="hint">⏳ <span data-cd="${o.exp}" data-k="me">${fmtMs(o.exp-Date.now())}</span> · ${TR.peer?'en ligne, visible des autres joueurs':'mise en ligne…'}</span><br><button type="button" class="act alt" data-tb="cancel">Retirer mon annonce</button></div>`;}

function onNetClose(){const c=NET.conn;if(!c)return;NET.conn=null;clearInterval(NET.pingI);
 try{c.off('data',onNet);c.off('close',onNetClose);}catch(e){}
 if(G&&G.online&&G.running&&G.state!=='over'){if(G.coop){banner('COÉQUIPIER PARTI','Fin de la partie',2400);endMatch(false);}else{banner('ADVERSAIRE DÉCONNECTÉ','Victoire par abandon',2400);G.forfeit=true;endMatch(true);}}
 else if(G&&G.online){$('again').textContent='Adversaire parti';}
 else netStatus('La connexion avec ton adversaire a été coupée.',true);
 try{NET.peer&&NET.peer.destroy();}catch(e){}NET.peer=null;NET.busy=false;NET.code='';if(PNL==='portal')renderPanel();}
function netClose(){NET.busy=false;clearNetTimers();clearInterval(NET.pingI);const c=NET.conn;NET.conn=null;
 if(c){try{c.off('data',onNet);c.off('close',onNetClose);c.send({t:'bye'});}catch(e){}setTimeout(()=>{try{c.close();}catch(e){}},150);}
 const pr=NET.peer;NET.peer=null;if(pr)setTimeout(()=>{try{pr.destroy();}catch(e){}},200);NET.code='';}
function netFail(msg){netClose();netStatus(msg,true);if(PNL==='portal')renderPanel();}
function updRematch(){const b=$('again');if(!G||!G.online||!G.opp)return;b.textContent=NET.wantRe?(NET.oppRe?'Lancement…':'En attente de '+G.opp.name+'…'):(NET.oppRe?G.opp.name+' veut une revanche !':'Revanche');}
function netBegin(kind){netClose();NET.busy=true;NET.kind=kind;NET.status='';NET.err=false;if(!S.name){S.name='Joueur'+Math.floor(100+Math.random()*900);persist();}renderPanel();}
async function netRandom(kind){if(NET.busy)return;const PF=kind==='coop'?'z-':'q-',MD=kind==='coop'?'coop':'ranked';netBegin('rand');netStatus('Connexion au serveur… 🌐');
 try{await loadPeer();}catch(e){return netFail("Impossible de charger le mode en ligne. Vérifie ta connexion internet.");}
 let me;try{me=await newPeer(null);}catch(e){return netFail('Impossible de joindre le serveur de jeu. Réessaie dans un instant.');}
 if(!NET.busy){try{me.destroy();}catch(e){}return;}NET.peer=me;me.on('error',()=>{});
 netStatus('Recherche d\'un adversaire… 🔎');
 for(let i=0;i<QSLOTS;i++){const c=await tryConnect(me,NS+PF+i,4000);if(!NET.busy||NET.peer!==me){try{c&&c.close();}catch(e){}return;}if(c)return beginConn(c,'client',MD);}
 NET.peer=null;try{me.destroy();}catch(e){}
 for(let i=0;i<QSLOTS;i++){let hp;try{hp=await newPeer(NS+PF+i);}catch(e){if(!NET.busy)return;if(e&&e.type==='unavailable-id')continue;return netFail('Problème de connexion au serveur. Réessaie.');}
  if(!NET.busy){try{hp.destroy();}catch(e){}return;}
  NET.peer=hp;hp.on('error',()=>{});hp.on('connection',c=>acceptConn(c,MD));
  netStatus('En attente d\'un adversaire… ⏳<br><small>Laisse cette fenêtre ouverte : dès qu\'un autre joueur cherche un 1v1, le match commence.</small>');
  if(i>0){const scan=async()=>{if(!NET.busy||NET.conn||NET.peer!==hp)return;for(let j=0;j<i;j++){const c=await tryConnect(hp,NS+PF+j,4000);if(NET.conn||!NET.busy||NET.peer!==hp){try{c&&c.close();}catch(e){}return;}if(c){try{hp.disconnect();}catch(e){}return beginConn(c,'client',MD);}}NET.timers.push(setTimeout(scan,9000+Math.random()*6000));};NET.timers.push(setTimeout(scan,6000));}
  return;}
 netFail('Trop de joueurs en attente en même temps, réessaie dans un instant.');}
function genCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<5;i++)c+=a[Math.floor(Math.random()*a.length)];return c;}
function inviteLink(){if(!NET.code||location.protocol==='file:')return '';return location.origin+location.pathname+'?defi='+NET.code;}
async function netHost(gm){if(NET.busy)return;netBegin('host');NET.hostMode=gm||'friendly';netStatus('Création de l\'invitation… 🌐');
 try{await loadPeer();}catch(e){return netFail("Impossible de charger le mode en ligne. Vérifie ta connexion internet.");}
 for(let a=0;a<5;a++){const code=genCode();let hp;try{hp=await newPeer(NS+'f-'+code);}catch(e){if(!NET.busy)return;if(e&&e.type==='unavailable-id')continue;return netFail('Impossible de joindre le serveur de jeu. Réessaie dans un instant.');}
  if(!NET.busy){try{hp.destroy();}catch(e){}return;}
  NET.peer=hp;NET.code=code;hp.on('error',()=>{});hp.on('connection',c=>acceptConn(c,NET.hostMode||'friendly'));
  NET.status='Envoie ce code à ton ami et attends-le ici. ⏳';NET.err=false;renderPanel();return;}
 netFail('Impossible de créer une invitation, réessaie.');}
async function netJoin(code){code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==5){toast('Le code doit faire 5 caractères');return;}
 if(NET.busy)netClose();netBegin('join');netStatus('Connexion à la partie de ton ami… 🌐');
 try{await loadPeer();}catch(e){return netFail("Impossible de charger le mode en ligne. Vérifie ta connexion internet.");}
 let me;try{me=await newPeer(null);}catch(e){return netFail('Impossible de joindre le serveur de jeu. Réessaie dans un instant.');}
 if(!NET.busy){try{me.destroy();}catch(e){}return;}NET.peer=me;me.on('error',()=>{});
 const c=await tryConnect(me,NS+'f-'+code,9000);if(!NET.busy||NET.peer!==me){try{c&&c.close();}catch(e){}return;}
 if(c)beginConn(c,'client','friendly');else netFail('Partie introuvable. Vérifie le code et que ton ami attend bien sur l\'écran d\'invitation.');}
function onlineHTML(){let h='';
 h+=`<div class="row"><span>Ton pseudo</span><input type="text" id="pseudo" maxlength="14" placeholder="Ton pseudo" value="${esc(S.name)}" style="width:58%" ${ACC.cur?'readonly':''}></div>`;
 h+=`<div class="row"><span>${LEAGUES[leagueIdx(S.trophies)].i} Ligue ${LEAGUES[leagueIdx(S.trophies)].n} · 🏆 ${S.trophies}</span><button type="button" class="act alt" data-open2="rank">Classement</button></div>`;
 h+=`<div id="netStatus" class="reveal ${NET.status?'':'hidden'}" style="${NET.err?'color:#ff8fa8':''}">${NET.status}</div>`;
 if(NET.code&&NET.kind==='host'){const l=inviteLink();h+=`<div class="reveal"><span class="hint">Code d'invitation</span><b style="font-size:36px;letter-spacing:6px;font-family:ui-monospace,monospace">${NET.code}</b>`+
  (l?`<input type="text" readonly value="${esc(l)}" style="margin-top:8px"><button type="button" class="act" data-net="share">📤 Partager le lien</button>`:`<span class="hint">Ton ami ouvre le jeu, va dans « En ligne » et entre ce code dans « Rejoindre un ami ».</span><button type="button" class="act" data-net="share">📤 Partager le code</button>`)+`</div>`;}
 if(NET.busy||NET.conn){h+=`<button type="button" class="big" style="background:var(--panel2);box-shadow:none" data-net="cancel">Annuler</button>`;}
 else{
  h+=`<h4>🎲 1v1 aléatoire (classé)</h4><p class="hint">Affronte un vrai joueur au hasard, premier à 5 manches. Victoire : +60 🪙 et +20 🏆. Défaite : +15 🪙 et −10 🏆.</p><button type="button" class="big" data-net="rand">Chercher un adversaire</button>`;
  h+=`<h4>🧟 Survie en équipe (2 joueurs)</h4><p class="hint">Trouve un coéquipier au hasard et affrontez ensemble les vagues de zombies. Si l'un de vous tombe, il revient à la vague suivante tant que l'autre tient bon. Récompenses normales !</p><button type="button" class="big" style="background:#2e9b4a;box-shadow:0 6px 0 #1a5f2c" data-net="randz">Trouver un coéquipier</button>`;
  h+=`<h4>🤝 Jouer avec un ami</h4><p class="hint">1v1 amical : pas de pièces ni de trophées. Survie en équipe : pièces comme en solo. La carte est celle choisie dans l'onglet « Contre des bots ».</p>
   <button type="button" class="act" data-net="host">📨 Inviter pour un 1v1</button> <button type="button" class="act" data-net="hostz">🧟 Inviter pour la Survie</button>
   <div style="display:flex;gap:8px;margin-top:10px"><input type="text" id="joinCode" maxlength="5" placeholder="Code de ton ami" style="text-transform:uppercase"><button type="button" class="act ok" data-net="join" style="margin:0;white-space:nowrap">Rejoindre</button></div>`;
 }
 h+=`<p class="hint" style="margin-top:14px">Il faut une connexion internet. Les deux joueurs se connectent directement ; sur certains réseaux (école, entreprise) la connexion peut être bloquée.</p>`;
 return h;}

/* ================== ENTRÉES ================== */
function lockPointer(){const c=cv;if(noLock||!c.requestPointerLock){noLock=true;return;}try{const r=c.requestPointerLock();if(r&&r.catch)r.catch(()=>{noLock=true;});}catch(e){noLock=true;}}
document.addEventListener('pointerlockerror',()=>{noLock=true;});
document.addEventListener('pointerlockchange',()=>{pointerLocked=document.pointerLockElement===cv;if(!pointerLocked&&MODE==='match'&&G&&G.running&&G.state!=='over'&&!isTouch)pause(true);});
function look(dx,dy,k){
 if(MODE==='lobby'){if(PNL)return;LB.camYaw-=dx*k*S.sens;LB.camPitch=clamp(LB.camPitch-dy*k*S.sens,-1.1,.5);return;}
 if(MODE!=='match'||!G||G.paused||!G.player.alive)return;const cz=G.player.ws[G.player.cur];const z=zoomed?(cz.zoom?.3:.6):1;G.player.yaw-=dx*k*S.sens*z;G.player.pitch=clamp(G.player.pitch-dy*k*S.sens*z,-1.45,1.45);}
let dragLook=false;
cv.addEventListener('mousedown',e=>{if(isTouch)return;
 if(MODE==='lobby'){if(!pointerLocked&&!noLock)lockPointer();else dragLook=true;return;}
 if(MODE!=='match'||!G||!G.running)return;if(!pointerLocked&&!noLock){lockPointer();return;}if(e.button===0)mouseDown=true;if(e.button===2)zoom(!zoomed);});
addEventListener('mouseup',e=>{if(e.button===0)mouseDown=false;dragLook=false;});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{if(isTouch)return;if(pointerLocked||(noLock&&(MODE==='match'||dragLook)))look(e.movementX||0,e.movementY||0,.0024);});
addEventListener('wheel',()=>{if(MODE==='match'&&G&&!G.paused&&G.player.ws.length>1)switchWeapon(1-G.player.cur);},{passive:true});
addEventListener('keydown',e=>{
 if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
 if(MODE==='lobby'){keys[e.code]=true;if(e.code==='Escape'&&PNL)closePanel();if(e.code==='KeyE'&&!PNL&&near&&near.id!=='portal')openPanel(near.id);if(e.code==='KeyB'&&!PNL)LB.p.dance=3.5;if(e.code==='Space'&&!PNL){e.preventDefault();if(LB.p.grounded){LB.p.vy=8;snd('jump');}}return;}
 if(MODE!=='match'||!G||!G.running)return;
 if(e.code==='Escape'||e.code==='KeyP'){if(!pointerLocked)pause(!G.paused);return;}
 if(G.paused)return;keys[e.code]=true;const p=G.player;
 if(e.code==='Space'){e.preventDefault();if(p.grounded&&p.alive&&G.state==='play'){p.vy=8;snd('jump');}}
 if(e.code==='KeyR')startReload(p);if(e.code==='Digit1')switchWeapon(0);if(e.code==='Digit2')switchWeapon(1);
 if(e.code==='KeyE'||e.code==='KeyG')useUtil(p);if(e.code==='KeyF')zoom(!zoomed);if(e.code==='KeyT'&&S.cheat&&S.cheat.u&&!G.online){S.cheat.on=!S.cheat.on;persist();toast(S.cheat.on?'🎯 Visée automatique : ACTIVÉE':'🎯 Visée automatique : désactivée');}
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouseDown=false;T.firing=false;});
function act(a){
 if(MODE==='lobby'){if(a==='jump'&&LB.p.grounded&&!PNL){LB.p.vy=8;snd('jump');}return;}
 if(MODE!=='match'||!G||G.paused)return;const p=G.player;if(!p.alive||G.state!=='play')return;
 if(a==='jump'&&p.grounded){p.vy=8;snd('jump');}
 if(a==='reload')startReload(p);if(a==='swap')switchWeapon(1-p.cur);if(a==='util')useUtil(p);if(a==='aim')zoom(!zoomed);
 if(a==='dash'){const [mx,mz]=inputMove(p);if(Math.hypot(mx,mz)>.2)doDash(p,mx,mz);else doDash(p,Math.sin(p.yaw),Math.cos(p.yaw));}
}
const joyBase=$('joyBase'),joyKnob=$('joyKnob');
$('joyZone').addEventListener('pointerdown',e=>{e.preventDefault();if(T.joy)return;T.joy={id:e.pointerId,x:e.clientX,y:e.clientY};joyBase.style.left=e.clientX+'px';joyBase.style.top=e.clientY+'px';joyBase.classList.add('on');});
$('lookZone').addEventListener('pointerdown',e=>{e.preventDefault();if(T.look)return;T.look={id:e.pointerId,x:e.clientX,y:e.clientY};});
document.querySelectorAll('.tb').forEach(btn=>{btn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();btn.classList.add('pressed');
 if(btn.dataset.act==='fire'){T.firing=true;if(!T.fire)T.fire={id:e.pointerId,x:e.clientX,y:e.clientY,btn};}else{act(btn.dataset.act);setTimeout(()=>btn.classList.remove('pressed'),120);}});});
addEventListener('pointermove',e=>{
 if(T.joy&&e.pointerId===T.joy.id){let dx=e.clientX-T.joy.x,dy=e.clientY-T.joy.y;const l=Math.hypot(dx,dy),m=50;if(l>m){dx*=m/l;dy*=m/l;}T.jx=dx/m;T.jy=dy/m;joyKnob.style.transform=`translate(${dx}px,${dy}px)`;}
 const lk=(T.look&&e.pointerId===T.look.id)?T.look:(T.fire&&e.pointerId===T.fire.id)?T.fire:null;
 if(lk){look(e.clientX-lk.x,e.clientY-lk.y,.0065);lk.x=e.clientX;lk.y=e.clientY;}},{passive:true});
function pEnd(e){if(T.joy&&e.pointerId===T.joy.id){T.joy=null;T.jx=T.jy=0;joyKnob.style.transform='';joyBase.classList.remove('on');joyBase.style.left='';joyBase.style.top='';}
 if(T.look&&e.pointerId===T.look.id)T.look=null;if(T.fire&&e.pointerId===T.fire.id){T.fire.btn.classList.remove('pressed');T.fire=null;T.firing=false;}}
addEventListener('pointerup',pEnd);addEventListener('pointercancel',pEnd);
document.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!isTouch&&S.touch==='auto'){isTouch=true;document.body.classList.add('touch');}},true);
$('talk').addEventListener('click',()=>{if(near)openPanel(near.id);});
$('cheatBtn').addEventListener('click',()=>{if(S.cheat&&S.cheat.u&&G&&!G.online){S.cheat.on=!S.cheat.on;persist();toast(S.cheat.on?'🎯 Visée automatique : ACTIVÉE':'🎯 Visée automatique : désactivée');}});
$('danceBtn').addEventListener('click',()=>{if(LB){LB.p.dance=3.5;snd('pad');}});
$('fightBtn').addEventListener('click',()=>openPanel('portal'));
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openPanel(b.dataset.open)));
function pause(on){if(!G||!G.running)return;G.paused=on;$('quit').textContent=G.online?'Abandonner le match':'Retour au lobby';$('pauseNote').textContent=G.online?'⚠️ En ligne, le match continue pendant la pause !':'';mouseDown=false;T.firing=false;$('pause').classList.toggle('hidden',!on);if(!on&&!isTouch)lockPointer();}
$('pauseBtn').addEventListener('click',()=>{if(pointerLocked&&document.exitPointerLock)document.exitPointerLock();else pause(true);});
$('resume').addEventListener('click',()=>pause(false));
function backToLobby(){zoom(false);G=null;$('end').classList.add('hidden');$('pause').classList.add('hidden');enterLobby();}
$('quit').addEventListener('click',()=>{if(G&&G.online){if(G.state!=='over'){netSend({t:'bye'});endMatch(false);}netClose();}if(G){const g=G;g.state='over';}backToLobby();});
$('toLobby').addEventListener('click',()=>{if(G&&G.online)netClose();S.offers=null;persist();backToLobby();});
$('again').addEventListener('click',()=>{S.offers=null;
 if(G&&G.online){if(!NET.conn){toast('Ton adversaire est parti.');return;}NET.wantRe=true;netSend({t:'rematch'});updRematch();if(NET.role==='host'&&NET.oppRe)hostStart();return;}
 $('end').classList.add('hidden');startMatch();});
function enterGame(){ac();if(AC&&AC.state==='suspended')AC.resume();if(!gl)return;$('splash').classList.add('hidden');enterLobby();tradeRecover();
 const dq=new URLSearchParams(location.search).get('defi');if(dq){try{history.replaceState(null,'',location.pathname);}catch(e){}openPanel('portal','online');netJoin(dq);}}
$('enter').addEventListener('click',enterGame);

/* ================== BOUCLE ================== */
let last=performance.now(),splashT=0;
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(Math.max(0,(now-last)/1000),.05);last=now;
 if(!gl)return;
 try{
  UC.emi=UC.a=UC.edge=UC.grid=-1;
  if(MODE==='match'&&G){if(G.running&&(!G.paused||G.online))updateMatch(dt);renderMatch(dt);}
  else if(MODE==='lobby'&&LB){updateLobby(dt);renderLobby();}
  else{if(!LOBBYW){LOBBYW=buildLobby();}WD=LOBBYW;splashT+=dt*.1;const e=[24+Math.cos(splashT)*22,9,24+Math.sin(splashT)*22];beginFrame(e,[24,2,24],1.1,WD.fog);drawMesh(WD.mesh,IDENT,[1,1,1],0,1,.08,0);
   for(const n of WD.npcs)drawChar({x:n.x,y:0,z:n.z,yaw:n.yaw,walk:0,walkAmt:0,color:n.c,skinC:'#f1c27d',hat:n.hat,hurtT:0},null);flushTQ();}
 }catch(e){const b=$('err');b.textContent='Erreur : '+e.message;b.style.display='block';console.error(e);}
}
requestAnimationFrame(frame);
